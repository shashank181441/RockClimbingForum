# Secrets (repo or environment "nepal_climbs"):
#   SERVER_HOST      VPS hostname or IP
#   SERVER_USER      SSH user
#   SERVER_SSH_KEY   Private key whose public half is in authorized_keys
# Optional repository variable:
#   DEPLOY_PATH      Default /opt/nepal-climbs

name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-nepal-climbs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: nepal_climbs

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/nepal-climbs' }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail

            cd "$DEPLOY_PATH"

            if [ ! -f docker-compose.yml ] && [ ! -f compose.yml ]; then
              echo "docker-compose.yml not found in $DEPLOY_PATH"
              ls -la
              exit 1
            fi

            if [ ! -f .env.production ]; then
              echo "Missing $DEPLOY_PATH/.env.production"
              echo "On the server: cp .env.production.example .env.production && nano .env.production"
              exit 1
            fi

            git pull

            if docker compose version >/dev/null 2>&1; then
              docker compose --env-file .env.production up -d --build
            elif command -v docker-compose >/dev/null 2>&1; then
              docker-compose --env-file .env.production up -d --build
            else
              echo "docker compose is not installed"
              exit 1
            fi

            docker image prune -f >/dev/null || true
            echo "Deploy finished at $DEPLOY_PATH"
